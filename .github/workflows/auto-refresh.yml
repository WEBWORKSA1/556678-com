name: Auto-refresh site

# Rebuilds the static site every Monday (rotates tip of the week, contest round,
# "last updated" dates, sitemap lastmod and RSS feed) and commits the result to main.
# GitHub Pages (Deploy from branch: main / root) republishes automatically on each push.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
    - cron: "23 6 1 * *"   # 1st of each month (new contest round)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild site
        run: python3 build.py
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "556678-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-refresh: weekly content rotation $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes"
          fi
